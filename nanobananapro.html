<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nano Banana Pro - AI画像生成</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 32px 16px 16px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-bottom: 1px solid #2a2a4a;
    }

    .header h1 {
      font-size: 26px;
      background: linear-gradient(90deg, #f7e05f, #f0a030);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .header p { color: #888; font-size: 14px; }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* Prompt */
    .prompt-section {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .prompt-section label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    .prompt-section textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      background: #0f0f1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .prompt-section textarea:focus { border-color: #f0a030; }

    /* Reference Images */
    .ref-section {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .ref-section label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    .ref-section .sub { color: #888; font-size: 13px; margin-bottom: 12px; }

    .drop-zone {
      border: 2px dashed #333;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: #f0a030;
      color: #f0a030;
      background: rgba(240, 160, 48, 0.05);
    }

    .ref-previews {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .ref-thumb {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
    }

    .ref-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ref-thumb .remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 12px;
      line-height: 20px;
      text-align: center;
    }

    .ref-thumb .remove:hover { background: #e55; }

    /* Options */
    .options {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .option-group label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }

    .options select {
      padding: 10px 14px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
    }

    .options select:focus { border-color: #f0a030; }

    /* Generate Button */
    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f7e05f, #f0a030);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 24px;
    }

    .generate-btn:hover { opacity: 0.9; }
    .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Result */
    .result {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      display: none;
    }

    .result img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .result .result-text {
      color: #ccc;
      font-size: 14px;
      text-align: left;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .result .download-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #2a2a4a;
      color: #e0e0e0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }

    .result .download-btn:hover { background: #3a3a5a; }

    /* Loading */
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
      color: #f0a030;
      font-size: 15px;
    }

    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a2a4a;
      border-top-color: #f0a030;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      background: #3a1a1a;
      border: 1px solid #5a2a2a;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f88;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Nano Banana Pro</h1>
    <p>AI画像生成ツール</p>
  </div>

  <div class="container">
    <!-- Prompt -->
    <div class="prompt-section">
      <label>プロンプト</label>
      <textarea id="promptInput" placeholder="例: サングラスをかけた可愛い猫がトロピカルビーチにいる、デジタルアート風"></textarea>
    </div>

    <!-- Reference Images -->
    <div class="ref-section">
      <label>参照画像（任意）</label>
      <div class="sub">最大6枚まで画像をアップロードできます。AIが参考にして画像を生成します。</div>
      <div class="drop-zone" id="dropZone">
        クリックまたはドラッグ&ドロップで画像を追加
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>
      <div class="ref-previews" id="refPreviews"></div>
    </div>

    <!-- Options -->
    <div class="options">
      <div class="option-group">
        <label>アスペクト比</label>
        <select id="aspectRatio">
          <option value="1:1">1:1（正方形）</option>
          <option value="16:9">16:9（横長）</option>
          <option value="9:16">9:16（縦長）</option>
          <option value="4:3">4:3</option>
          <option value="3:4">3:4</option>
        </select>
      </div>
      <div class="option-group">
        <label>解像度</label>
        <select id="imageSize">
          <option value="1K">1K</option>
          <option value="2K" selected>2K</option>
          <option value="4K">4K</option>
        </select>
      </div>
    </div>

    <!-- Generate -->
    <button class="generate-btn" id="generateBtn">画像を生成する</button>

    <!-- Error -->
    <div class="error" id="errorMsg"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      Nano Banana Pro で生成中...
    </div>

    <!-- Result -->
    <div class="result" id="result">
      <div class="result-text" id="resultText"></div>
      <img id="resultImg" alt="生成された画像">
      <br>
      <a class="download-btn" id="downloadBtn" download="nanobananapro.png">ダウンロード</a>
    </div>
  </div>

  <script>
    const promptInput = document.getElementById("promptInput");
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const refPreviews = document.getElementById("refPreviews");
    const aspectRatio = document.getElementById("aspectRatio");
    const imageSize = document.getElementById("imageSize");
    const generateBtn = document.getElementById("generateBtn");
    const loading = document.getElementById("loading");
    const result = document.getElementById("result");
    const resultImg = document.getElementById("resultImg");
    const resultText = document.getElementById("resultText");
    const downloadBtn = document.getElementById("downloadBtn");
    const errorMsg = document.getElementById("errorMsg");

    let refImages = [];

    // --- 参照画像 ---
    dropZone.addEventListener("click", () => fileInput.click());

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener("change", () => {
      handleFiles(fileInput.files);
      fileInput.value = "";
    });

    function handleFiles(files) {
      for (const file of files) {
        if (refImages.length >= 6) break;
        if (!file.type.startsWith("image/")) continue;

        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          const base64 = dataUrl.split(",")[1];
          const mimeType = file.type;
          refImages.push({ base64, mimeType, dataUrl });
          renderPreviews();
        };
        reader.readAsDataURL(file);
      }
    }

    function renderPreviews() {
      refPreviews.innerHTML = "";
      refImages.forEach((img, i) => {
        const div = document.createElement("div");
        div.className = "ref-thumb";

        const imgEl = document.createElement("img");
        imgEl.src = img.dataUrl;

        const btn = document.createElement("button");
        btn.className = "remove";
        btn.textContent = "\u00d7";
        btn.addEventListener("click", () => {
          refImages.splice(i, 1);
          renderPreviews();
        });

        div.appendChild(imgEl);
        div.appendChild(btn);
        refPreviews.appendChild(div);
      });
    }

    // --- 画像生成 ---
    generateBtn.addEventListener("click", generate);

    async function generate() {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        showError("プロンプトを入力してください。");
        return;
      }

      hideError();
      result.style.display = "none";
      loading.style.display = "block";
      generateBtn.disabled = true;

      const parts = [{ text: prompt }];
      for (const img of refImages) {
        parts.push({
          inline_data: { mime_type: img.mimeType, data: img.base64 }
        });
      }

      const body = {
        contents: [{ parts }],
        generationConfig: {
          responseModalities: ["TEXT", "IMAGE"],
          imageConfig: {
            aspectRatio: aspectRatio.value,
            imageSize: imageSize.value
          }
        }
      };

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "APIエラーが発生しました。");
        }

        const candidate = data.candidates?.[0]?.content?.parts;
        if (!candidate) throw new Error("AIからの応答がありませんでした。");

        let imageData = null;
        let imageMime = "image/png";
        let textContent = "";

        for (const part of candidate) {
          if (part.inline_data) {
            imageData = part.inline_data.data;
            imageMime = part.inline_data.mime_type || "image/png";
          }
          if (part.text) {
            textContent += part.text;
          }
        }

        result.style.display = "block";

        if (textContent) {
          resultText.textContent = textContent;
          resultText.style.display = "block";
        } else {
          resultText.style.display = "none";
        }

        if (imageData) {
          const src = `data:${imageMime};base64,${imageData}`;
          resultImg.src = src;
          resultImg.style.display = "block";
          downloadBtn.href = src;
          downloadBtn.style.display = "inline-block";
        } else {
          resultImg.style.display = "none";
          downloadBtn.style.display = "none";
        }
      } catch (e) {
        showError(e.message);
      } finally {
        loading.style.display = "none";
        generateBtn.disabled = false;
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
    }

    function hideError() {
      errorMsg.style.display = "none";
    }
  </script>
</body>
</html>
